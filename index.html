<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Memory Lane · Our Album</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--ink:#121212;--paper:#ffffff;--muted:#5d5d66;--pink:#e57fc6}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--paper);color:var(--ink);
  font-family:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0);
  overflow-x:hidden;
  -webkit-text-size-adjust:100%;
}
.topbar{background:var(--pink);color:#fff;font-size:13px;padding:9px 24px;display:flex;justify-content:space-between;gap:12px}
header{max-width:1100px;margin:0 auto;padding:20px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.logo{font-family:"Syne",system-ui,sans-serif;font-weight:800;font-size:26px;letter-spacing:-.02em;white-space:nowrap}
.logo i{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--pink);margin-left:3px}
nav{display:flex;gap:26px;font-size:14px;color:var(--muted)}
nav a{color:inherit;text-decoration:none}
nav a:first-child{color:var(--ink)}

.hero{max-width:760px;margin:0 auto;padding:36px 24px 34px;text-align:center}
h1{font-family:"Syne",system-ui,sans-serif;font-weight:700;font-size:clamp(32px,7.2vw,62px);line-height:1.1;letter-spacing:-.02em;margin:0 0 16px}
.hero p{color:var(--muted);font-size:17px;line-height:1.6;max-width:46ch;margin:0 auto 26px}
.pill{font:inherit;font-weight:500;font-size:16px;border-radius:999px;padding:15px 32px;min-height:50px;border:1px solid var(--ink);background:var(--ink);color:#fff;cursor:pointer;touch-action:manipulation}
.pill:focus-visible{outline:3px solid var(--pink);outline-offset:3px}
.pill:disabled{cursor:default;opacity:.85}

/* curved photo band */
.band{position:relative;height:clamp(300px,52vw,470px);overflow:hidden;margin-top:6px}
.band::before,.band::after{content:"";position:absolute;left:-12%;right:-12%;height:clamp(60px,12vw,110px);background:var(--paper);border-radius:50%;z-index:2}
.band::before{top:calc(clamp(60px,12vw,110px) / -1.8)}
.band::after{bottom:calc(clamp(60px,12vw,110px) / -1.8)}
.track{display:flex;gap:clamp(12px,2.2vw,22px);height:100%;padding:clamp(24px,4vw,34px) 0;width:max-content;animation:drift 42s linear infinite}
.card{flex:none;width:clamp(160px,58vw,270px);height:100%;border-radius:6px;overflow:hidden;position:relative;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.9);font-family:"Syne",system-ui,sans-serif;font-weight:600}
@media (min-width:700px){.card{width:clamp(200px,24vw,270px)}}
.card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.card:nth-child(6n+1){background:linear-gradient(160deg,#f4a6c0,#7aa59a)}
.card:nth-child(6n+2){background:linear-gradient(160deg,#e9e3f5,#c9b6e6)}
.card:nth-child(6n+3){background:linear-gradient(160deg,#e7a53a,#5a2d0c)}
.card:nth-child(6n+4){background:linear-gradient(160deg,#cfd8de,#7e93a3)}
.card:nth-child(6n+5){background:linear-gradient(160deg,#9fd3b4,#2f6b55)}
.card:nth-child(6n+6){background:linear-gradient(160deg,#f6d6a8,#d98a6a)}
@keyframes drift{to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){.track{animation:none}.band{overflow-x:auto}}

.tag{max-width:760px;margin:0 auto;padding:36px 24px 60px;text-align:center}
.tag h2{font-family:"Syne",system-ui,sans-serif;font-weight:700;font-size:clamp(24px,5vw,36px);margin:0 0 10px}
.tag p{color:var(--muted);margin:0;line-height:1.6}

@media (max-width:720px){
  nav{display:none}
  .topbar{justify-content:center;text-align:center;padding:8px 16px}
  .topbar span:last-child{display:none}
  header{padding:16px 20px}
  .hero{padding:24px 20px 26px}
  .hero p{font-size:16px;margin-bottom:22px}
  .pill{width:100%;max-width:320px}
  .tag{padding:28px 20px 48px}
}
</style>
</head>
<body>
<div class="topbar"><span>hello@memorylane.com</span><span>Our little album of moments</span></div>

<header>
  <div class="logo">Memory Lane<i></i></div>
  <nav><a href="#">Home</a><a href="#">Albums</a><a href="#">Stories</a><a href="#">Contact</a></nav>
</header>

<section class="hero">
  <h1>Every Memory, Kept Close.</h1>
  <p>A small album of the people, places and little moments worth remembering. Take a look through.</p>
  <button class="pill" id="open" type="button">Open album ↗</button>
</section>

<section class="band" aria-label="Photo album">
  <div class="track" id="track"></div>
</section>

<section class="tag">
  <h2>Moments that stay</h2>
  <p>Simple pictures, big feelings.</p>
</section>

<audio id="snd" preload="auto">
  <source src="sound.mp3" type="audio/mpeg">
  <source src="sound.m4a" type="audio/mp4">
  <source src="sound.ogg" type="audio/ogg">
  <source src="sound.wav" type="audio/wav">
</audio>

<script>
(function(){
  // ====== EDIT THIS LIST IN VS CODE ======
  // Add your images to the "photos" folder, then list their paths here.
  // Add or remove lines freely. Missing files show a colored placeholder.
  var PHOTOS=[
    'photos/1.jpg',
    'photos/2.jpg',
    'photos/3.jpg',
    'photos/4.jpg',
    'photos/5.jpg',
    'photos/6.jpg'
  ];
  // =======================================

  var track=document.getElementById('track');
  function build(){
    var html='';
    for(var i=0;i<PHOTOS.length;i++){
      html+='<div class="card"><span>Memory '+(i+1)+'</span><img src="'+PHOTOS[i]+'" alt="" onerror="this.remove()"></div>';
    }
    return html;
  }
  track.innerHTML=build()+build(); // doubled so the drifting band loops seamlessly

  var snd=document.getElementById('snd');
  var btn=document.getElementById('open');
  snd.volume=1;   // max for the page; the device volume decides final loudness
  snd.loop=true;  // repeats with no pause until the tab is closed

  btn.addEventListener('click',function(){
    try{
      snd.currentTime=0;
      var p=snd.play();
      if(p&&p.catch){p.catch(function(e){console.error('Could not play the sound file',e);});}
    }catch(e){console.error(e);}
    if(!window.__leaveGuard){
      window.__leaveGuard=function(e){e.preventDefault();e.returnValue='';return '';};
      window.addEventListener('beforeunload',window.__leaveGuard);
    }
    btn.disabled=true;
    btn.textContent='Opening album…';
    setTimeout(function(){btn.disabled=false;btn.textContent='Open album ↗';},4000);
  });
})();
</script>
</body>
</html>
